stages:
  - test
  - package
  - deploy

variables:
  REGISTRY: dvp-srv-gitlab.campus12avenue.fr:5050
  IMAGE_BASE: dvp-srv-gitlab.campus12avenue.fr:5050/tp-devops-2526/s04/flowfield

default:
  image:
    name: dvp-srv-gitlab.campus12avenue.fr:5050/root/tp1:latest
    entrypoint: [""]
  tags:
    - docker

# ── TEST ────────────────────────────────────────────────────────
test_backend:
  stage: test
  image: python:3.12-slim
  before_script:
    - cd backend
    - pip install -r requirements-test.txt --quiet
  script:
    - pytest tests/ -v
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

test_export:
  stage: test
  image: python:3.12-slim
  before_script:
    - cd export
    - pip install -r requirements.txt -r requirements-test.txt --quiet
  script:
    - pytest tests/ -v
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── PACKAGE (build + push images Docker) ────────────────────────
.package_defaults: &package_defaults
  stage: package
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--insecure-registry=dvp-srv-gitlab.campus12avenue.fr:5050"]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

package_frontend:
  <<: *package_defaults
  script:
    - docker build -t $IMAGE_BASE/frontend:$CI_COMMIT_SHA -t $IMAGE_BASE/frontend:latest ./frontend
    - docker push "$IMAGE_BASE/frontend:$CI_COMMIT_SHA"
    - docker push "$IMAGE_BASE/frontend:latest"

package_backend:
  <<: *package_defaults
  script:
    - docker build -t $IMAGE_BASE/backend:$CI_COMMIT_SHA -t $IMAGE_BASE/backend:latest ./backend
    - docker push "$IMAGE_BASE/backend:$CI_COMMIT_SHA"
    - docker push "$IMAGE_BASE/backend:latest"

package_export:
  <<: *package_defaults
  script:
    - docker build -t $IMAGE_BASE/export:$CI_COMMIT_SHA -t $IMAGE_BASE/export:latest ./export
    - docker push "$IMAGE_BASE/export:$CI_COMMIT_SHA"
    - docker push "$IMAGE_BASE/export:latest"

package_postgres:
  <<: *package_defaults
  script:
    - docker pull postgres:16
    - docker tag postgres:16 $IMAGE_BASE/postgres:16
    - docker push "$IMAGE_BASE/postgres:16"

# ── DEPLOY (trigger pipeline infra) ─────────────────────────────
.trigger_defaults: &trigger_defaults
  stage: deploy
  variables:
    IMAGE_TAG: $CI_COMMIT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

trigger_infra_dev:
  <<: *trigger_defaults
  trigger:
    project: tp-devops-2526/s04/infra
    branch: develop
    strategy: depend

trigger_infra_prod:
  <<: *trigger_defaults
  trigger:
    project: tp-devops-2526/s04/infra
    branch: main
    strategy: depend
