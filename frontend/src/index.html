<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowField</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; overflow: hidden; }
    canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; }

    #overlay {
      position: fixed;
      top: 16px;
      left: 16px;
      color: rgba(255,255,255,0.5);
      font-family: monospace;
      font-size: 12px;
      pointer-events: none;
      z-index: 10;
    }
    #overlay h1 { font-size: 14px; font-weight: bold; margin-bottom: 2px; }
    #overlay p  { font-size: 11px; }

    #controls {
      position: fixed;
      bottom: 16px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ctrl-label {
      color: rgba(255,255,255,0.5);
      font-family: monospace;
      font-size: 11px;
      width: 76px;
    }
    .ctrl-value {
      color: rgba(255,255,255,0.7);
      font-family: monospace;
      font-size: 11px;
      width: 36px;
      text-align: right;
    }
    input[type=range] {
      width: 130px;
      accent-color: rgba(255,255,255,0.6);
      cursor: pointer;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="overlay">
    <h1>FlowField</h1>
    <p>Simulation de champ vectoriel génératif</p>
    <p id="health">API : … — DB : …</p>
  </div>

  <script type="module" src="./main.js"></script>
  <script type="module">
    fetch('/api/health')
      .then(r => r.json())
      .then(d => {
        document.getElementById('health').textContent =
          `API : ${d.status} — DB : ${d.db ?? 'n/a'}`;
      })
      .catch(() => {
        document.getElementById('health').textContent = 'API : ko';
      });
  </script>
</body>
</html>
