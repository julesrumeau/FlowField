<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowField</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; overflow: hidden; }
    canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; }

    #overlay {
      position: fixed;
      top: 16px;
      left: 16px;
      color: rgba(255,255,255,0.5);
      font-family: monospace;
      font-size: 12px;
      pointer-events: none;
      z-index: 10;
    }
    #overlay h1 { font-size: 14px; font-weight: bold; margin-bottom: 2px; }
    #overlay p  { font-size: 11px; }

    #controls {
      position: fixed;
      bottom: 16px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ctrl-label {
      color: rgba(255,255,255,0.5);
      font-family: monospace;
      font-size: 11px;
      width: 76px;
    }
    .ctrl-value {
      color: rgba(255,255,255,0.7);
      font-family: monospace;
      font-size: 11px;
      width: 36px;
      text-align: right;
    }
    input[type=range] {
      width: 130px;
      accent-color: rgba(255,255,255,0.6);
      cursor: pointer;
    }

    #preset-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
      width: 200px;
    }
    .preset-header {
      color: rgba(255,255,255,0.5);
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
    }
    .preset-save-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6);
      font-family: monospace;
      font-size: 11px;
      padding: 4px 8px;
      cursor: pointer;
      text-align: left;
    }
    .preset-save-btn:hover {
      border-color: rgba(255,255,255,0.5);
      color: rgba(255,255,255,0.9);
    }
    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 60vh;
      overflow-y: auto;
    }
    .preset-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 0;
    }
    .preset-name {
      color: rgba(255,255,255,0.6);
      font-family: monospace;
      font-size: 11px;
      cursor: pointer;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preset-name:hover { color: rgba(255,255,255,0.9); }
    .preset-delete {
      background: none;
      border: none;
      color: rgba(255,255,255,0.3);
      font-size: 10px;
      cursor: pointer;
      padding: 0 4px;
      flex-shrink: 0;
    }
    .preset-delete:hover { color: rgba(255,80,80,0.8); }
    .preset-error {
      color: rgba(255,80,80,0.8);
      font-family: monospace;
      font-size: 10px;
      min-height: 14px;
    }
    #export-panel {
      position: fixed;
      bottom: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      z-index: 10;
    }
    #health-panel {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
    }
    #btn-export {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6);
      font-family: monospace;
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
    }
    #btn-export:hover:not(:disabled) {
      border-color: rgba(255,255,255,0.5);
      color: rgba(255,255,255,0.9);
    }
    #btn-export:disabled {
      opacity: 0.5;
      cursor: default;
    }
    #export-msg {
      color: rgba(255,80,80,0.8);
      font-family: monospace;
      font-size: 10px;
      min-height: 14px;
    }
    #preset-popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .popup-box {
      background: #1a1a2a;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 240px;
      font-family: monospace;
    }
    .popup-input {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.9);
      font-size: 12px;
      padding: 6px 8px;
      outline: none;
    }
    .popup-input:focus { border-color: rgba(255,255,255,0.5); }
    .popup-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .popup-confirm, .popup-cancel {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6);
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .popup-confirm:hover {
      border-color: rgba(255,255,255,0.5);
      color: rgba(255,255,255,0.9);
    }
    .popup-cancel:hover {
      border-color: rgba(255,80,80,0.4);
      color: rgba(255,80,80,0.8);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script src="https://mrdoob.github.io/stats.js/build/stats.min.js"></script>
  <div id="export-panel">
    <button id="btn-export">Export MP4</button>
    <span id="export-msg"></span>
  </div>
  <div id="health-panel">
    <span id="health"></span>
  </div>
  <script type="module" src="./main.js"></script>
  <script type="module">
    fetch('/api/health')
      .then(r => r.json())
      .then(d => {
        document.getElementById('health').textContent =
          `API : ${d.status} — DB : ${d.db ?? 'n/a'}`;
      })
      .catch(() => {
        document.getElementById('health').textContent = 'API : ko';
      });
  </script>
</body>
</html>
