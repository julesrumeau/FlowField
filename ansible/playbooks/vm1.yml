- name: Configure VM1 - Docker + FlowField
  hosts: vm1
  become: true
  vars:
    app_dir: /opt/flowfield
    registry_url: dvp-srv-gitlab.campus12avenue.fr:5050
    db_password: "{{ lookup('env', 'DB_PASSWORD') }}"

  tasks:

    # ── DOCKER ──────────────────────────────────────────────────

    - name: Check installed packages
      package_facts:

    - name: Install Docker dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - openssl
          - python3-docker
        state: present
        update_cache: true

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/debian/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/debian {{ ansible_facts['distribution_release'] }} stable"
        state: present

    - name: Install Docker CE and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
        state: present

    # ── DNS ─────────────────────────────────────────────────────

    - name: Configure host DNS
      copy:
        dest: /etc/resolv.conf
        content: |
          nameserver {{ dns_server }}
          search {{ dns_search }}
        owner: root
        group: root
        mode: "0644"

    - name: Configure Docker DNS
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "dns": ["{{ dns_server }}"],
            "dns-search": ["{{ dns_search }}"]
          }
        owner: root
        group: root
        mode: "0644"
      notify: Restart Docker

    # ── TLS CERTIFICATE ──────────────────────────────────────────

    - name: Ensure Docker cert directory exists
      file:
        path: /etc/docker/certs.d/dvp-srv-gitlab.campus12avenue.fr:5050
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Retrieve GitLab registry certificate
      shell: |
        echo | openssl s_client -connect 172.16.21.16:5050 -showcerts 2>/dev/null \
        | openssl x509 -outform PEM
      register: registry_cert
      changed_when: false

    - name: Install cert for Docker registry (certs.d)
      copy:
        dest: /etc/docker/certs.d/dvp-srv-gitlab.campus12avenue.fr:5050/ca.crt
        content: "{{ registry_cert.stdout }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart Docker

    - name: Install cert in system CA bundle
      copy:
        dest: /usr/local/share/ca-certificates/gitlab-ca.crt
        content: "{{ registry_cert.stdout }}"
        owner: root
        group: root
        mode: "0644"

    - name: Update system CA certificates
      command: update-ca-certificates
      changed_when: true

    - name: Flush handlers
      meta: flush_handlers

    # ── SERVICE ──────────────────────────────────────────────────

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: true

    # ── REGISTRY ─────────────────────────────────────────────────

    - name: Add GitLab registry to /etc/hosts
      lineinfile:
        path: /etc/hosts
        line: "172.16.21.16 dvp-srv-gitlab.campus12avenue.fr"
        state: present

    - name: Log in to GitLab registry
      shell: |
        echo "{{ lookup('env', 'REGISTRY_API_TOKEN') }}" | \
        docker login {{ registry_url }} -u oauth2 --password-stdin
      environment:
        HOME: /root
      no_log: true

    # ── DEPLOY ───────────────────────────────────────────────────

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy compose.yaml
      copy:
        src: ../../compose.yaml
        dest: "{{ app_dir }}/compose.yaml"

    - name: Write .env file
      copy:
        content: |
          DB_PASSWORD={{ db_password }}
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Deploy with Docker Compose
      shell: |
        docker compose -f {{ app_dir }}/compose.yaml up -d --pull always
      environment:
        HOME: /root

  handlers:
    - name: Restart Docker
      service:
        name: docker
        state: restarted
