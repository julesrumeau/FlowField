- name: Configure VM1 - Docker + FlowField
  hosts: vm1
  become: true
  vars:
    app_dir: /opt/flowfield
    registry_url: dvp-srv-gitlab.campus12avenue.fr:5050
    db_password: "{{ lookup('env', 'DB_PASSWORD') }}"

  tasks:

    - name: Check if docker is installed (package)
      package_facts:

    - name: Install Docker
      package:
        name: docker.io
        state: present
      when: "'docker.io' not in ansible_facts.packages"

    - name: Ensure Docker config directory exists
      file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure host DNS (resolv.conf)
      copy:
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          nameserver {{ dns_server }}
          search {{ dns_search }}

    - name: Configure Docker DNS
      copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "dns": ["{{ dns_server }}"],
            "dns-search": ["{{ dns_search }}"]
          }

    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted

    - name: Ensure Docker registry cert directory exists
      file:
        path: /etc/docker/certs.d/dvp-srv-gitlab.campus12avenue.fr:5050
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install openssl
      apt:
        name: openssl
        state: present
        update_cache: true

    - name: Retrieve GitLab registry certificate
      shell: |
        echo | openssl s_client -connect dvp-srv-gitlab.campus12avenue.fr:5050 -showcerts 2>/dev/null \
        | openssl x509 -outform PEM
      register: registry_cert
      changed_when: false

    - name: Install GitLab registry certificate for Docker
      copy:
        dest: /etc/docker/certs.d/dvp-srv-gitlab.campus12avenue.fr:5050/ca.crt
        content: "{{ registry_cert.stdout }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart Docker

    - name: Flush handlers before Docker login
      meta: flush_handlers

    - name: Install Python Docker SDK and compose dependencies
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-docker
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Add GitLab registry to /etc/hosts
      lineinfile:
        path: /etc/hosts
        line: "172.16.21.16 dvp-srv-gitlab.campus12avenue.fr"
        state: present

    - name: Login to GitLab container registry
      community.docker.docker_login:
        registry_url: "{{ registry_url }}"
        username: "oauth2"
        password: "{{ lookup('env', 'REGISTRY_API_TOKEN') }}"

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy compose.yaml
      copy:
        src: ../../compose.yaml
        dest: "{{ app_dir }}/compose.yaml"

    - name: Write .env file
      copy:
        content: |
          DB_PASSWORD={{ db_password }}
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Deploy with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        pull: always
        state: present

  handlers:
    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted
